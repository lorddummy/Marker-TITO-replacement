<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cage Terminal — Marker-TITO</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #e6edf3; background: #0d1117; }
    body { max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; margin-bottom: 0.25rem; }
    p.sub { color: #8b949e; font-size: 0.9rem; margin-top: 0; }
    label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.85rem; color: #8b949e; }
    input, select, button { width: 100%; box-sizing: border-box; padding: 0.6rem; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; }
    button { margin-top: 1rem; background: #238636; border: none; font-weight: 600; cursor: pointer; }
    button.secondary { background: #21262d; margin-top: 0.5rem; }
    pre { background: #161b22; border: 1px solid #30363d; padding: 0.75rem; border-radius: 6px; overflow: auto; font-size: 0.8rem; min-height: 4rem; }
    .ok { color: #3fb950; }
    .err { color: #f85149; }
  </style>
</head>
<body>
  <h1>Cage terminal</h1>
  <p class="sub">Validate and redeem digital TITO tickets. API keys stay in this browser session only.</p>

  <label>API base URL</label>
  <input id="base" value="" placeholder="http://localhost:3000" />

  <label>Cage API key</label>
  <input id="key" type="password" placeholder="CAGE_KEYS value" />

  <label>Property ID</label>
  <input id="property" value="PROP-001" />

  <label>Redemption point</label>
  <input id="cage" value="CAGE-01" />

  <label>Token or short code</label>
  <input id="code" placeholder="ABCD-EFGH-JKLM or token" />

  <button type="button" id="validate">Validate</button>
  <button type="button" class="secondary" id="redeem">Redeem</button>

  <label>Result</label>
  <pre id="out">Ready.</pre>

  <script>
    const baseInput = document.getElementById('base');
    baseInput.value = location.origin;

    async function call(path, body) {
      const base = baseInput.value.replace(/\/$/, '');
      const key = document.getElementById('key').value;
      const out = document.getElementById('out');
      if (!key) { out.textContent = 'Enter cage API key.'; out.className = 'err'; return; }
      out.textContent = 'Loading…';
      try {
        const res = await fetch(base + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-API-Key': key },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
        out.className = res.ok ? 'ok' : 'err';
      } catch (e) {
        out.textContent = String(e);
        out.className = 'err';
      }
    }

    function payload() {
      const raw = document.getElementById('code').value.trim();
      const body = {
        property_id: document.getElementById('property').value.trim(),
        redemption_point_id: document.getElementById('cage').value.trim(),
      };
      if (raw.includes('-') && raw.length < 64) body.short_code = raw;
      else body.token = raw;
      return body;
    }

    document.getElementById('validate').onclick = () => call('/v1/tickets/validate', payload());
    document.getElementById('redeem').onclick = () => call('/v1/tickets/redeem', payload());
  </script>
</body>
</html>
